<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Programa de Eventos - Com4ºDN</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
        .navy-bg { background-color: #002D5E; }
        .navy-dark-bg { background-color: #001D3D; }
        .gold-text { color: #FFBD26; }
        .gold-border { border-color: #FFBD26; }
        .glass { background: rgba(0, 45, 94, 0.85); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); }
        
        /* Bottom Sheet Animation */
        .modal-enter { transform: translateY(100%); transition: transform 0.3s ease-out; }
        .modal-active { transform: translateY(0); }
        
        .pulse-red {
            box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7);
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.4); }
            70% { box-shadow: 0 0 0 10px rgba(239, 68, 68, 0); }
            100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
        }

        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        .now-indicator {
            position: absolute;
            left: 0;
            right: 0;
            height: 2px;
            background-color: #ef4444;
            z-index: 20;
        }
        .now-indicator::before {
            content: '';
            position: absolute;
            left: -4px;
            top: -4px;
            width: 10px;
            height: 10px;
            background-color: #ef4444;
            border-radius: 50%;
        }
    </style>
</head>
<body class="pb-24">

    <!-- Header -->
    <header class="glass sticky top-0 z-50 text-white border-b-2 gold-border p-4 shadow-lg">
        <div class="max-w-md mx-auto flex justify-between items-center">
            <div>
                <h1 class="text-xs uppercase tracking-widest font-bold opacity-80">Marinha do Brasil</h1>
                <h2 class="text-lg font-bold leading-tight">Comando do 4º Distrito Naval</h2>
                <p class="text-[10px] gold-text font-semibold uppercase">Visita: C Alte (Refº-FN) Elkfury</p>
            </div>
            <div class="flex gap-2">
                <button onclick="toggleType()" class="bg-white/10 p-2 rounded-full hover:bg-white/20 transition">
                    <i data-lucide="settings-2" class="w-5 h-5 text-white"></i>
                </button>
            </div>
        </div>
    </header>

    <!-- App Content -->
    <main class="max-w-md mx-auto p-4" id="app-content">
        
        <!-- Day Selector Tabs -->
        <div class="flex space-x-2 overflow-x-auto no-scrollbar mb-6" id="day-tabs">
            <!-- Tabs injected by JS -->
        </div>

        <!-- Schedule Container -->
        <div class="relative space-y-4" id="schedule-container">
            <!-- Now Line Indicator (Dynamic) -->
            <div id="live-line" class="now-indicator hidden pulse-red"></div>
            <!-- Cards injected by JS -->
        </div>
    </main>

    <!-- Quick Access Navigation -->
    <nav class="fixed bottom-0 left-0 right-0 glass border-t gold-border px-2 py-3 z-40">
        <div class="max-w-md mx-auto flex justify-around items-center">
            <button onclick="openModal('authorities')" class="flex flex-col items-center text-white/70 hover:text-white">
                <i data-lucide="users" class="w-6 h-6"></i>
                <span class="text-[10px] mt-1">Autoridades</span>
            </button>
            <button onclick="openModal('logistics')" class="flex flex-col items-center text-white/70 hover:text-white">
                <i data-lucide="car" class="w-6 h-6"></i>
                <span class="text-[10px] mt-1">Viaturas</span>
            </button>
            <button onclick="openModal('uniforms')" class="flex flex-col items-center text-white/70 hover:text-white">
                <i data-lucide="shirt" class="w-6 h-6"></i>
                <span class="text-[10px] mt-1">Uniformes</span>
            </button>
            <button onclick="openModal('stay')" class="flex flex-col items-center text-white/70 hover:text-white">
                <i data-lucide="home" class="w-6 h-6"></i>
                <span class="text-[10px] mt-1">Estadia</span>
            </button>
        </div>
    </nav>

    <!-- Modals (Bottom Sheets) -->
    <div id="modal-overlay" class="fixed inset-0 bg-black/60 hidden z-[60]" onclick="closeModal()"></div>
    
    <div id="bottom-sheet" class="fixed bottom-0 left-0 right-0 bg-white rounded-t-3xl z-[70] modal-enter max-w-md mx-auto shadow-2xl overflow-hidden">
        <div class="w-12 h-1.5 bg-gray-300 rounded-full mx-auto mt-3 mb-4"></div>
        <div id="modal-content" class="p-6 max-h-[80vh] overflow-y-auto">
            <!-- Content injected by JS -->
        </div>
    </div>

    <script>
        // DATA OBJECTS
        const appState = {
            isTravel: false, // Default: Institutional Visit
            currentDay: '2025-05-05' // Base date from PDF (using 2025 as example)
        };

        const schedule = [
            {
                date: '2025-05-05',
                label: '05 Mai (Ter)',
                events: [
                    { id: '05.01', time: '12:00', title: 'Recepção ao C Alte (Ref-FN) Elkfury', flight: 'GLO 2006', loc: 'Aeroporto Internacional de Belém', uniform: 'OP3', obs: 'Participantes: DN-01 e DN-01.1' },
                    { id: '05.02', time: '12:20', title: 'Deslocamento para Residência Funcional', loc: 'Residência Com4ºDN', uniform: 'OP3', obs: 'Participantes: DN-01 e DN-01.1' },
                    { id: '05.03', time: '12:45', title: 'Almoço na Residência do Com4ºDN', loc: 'Vila Naval Espadarte', uniform: 'Esporte Amazônico', obs: 'Participantes: DN-01 e C Alte Elkfury' },
                    { id: '05.04', time: '19:30', title: 'Jantar', loc: 'Restaurante Amazônia na Cuia', uniform: 'Esporte Amazônico', obs: 'Participantes: DN-01, C Alte Elkfury e DN-02' }
                ]
            },
            {
                date: '2025-05-06',
                label: '06 Mai (Qua)',
                events: [
                    { id: '06.01', time: '06:00', title: 'Prática de TFM', loc: 'Parque Estadual do Utinga', uniform: 'TFM', obs: 'Participantes: DN-01, C Alte Elkfury' },
                    { id: '06.02', time: '07:30', title: 'Café da Manhã', loc: 'Residência Funcional do Com4ºDN', uniform: 'Esporte Amazônico', obs: 'Participantes: DN-01, C Alte Elkfury e DN-02' },
                    { id: '06.03', time: '08:20', title: 'Deslocamento para CIABA', loc: 'CIABA', uniform: 'OP3/6.6', obs: '' },
                    { id: '06.04', time: '08:35', title: 'Honras de recepção ao CPO-01', loc: 'CIABA', uniform: 'OP3/6.6', obs: 'Participantes: C Alte Elkfury e CIABA-01' },
                    { id: '06.05', time: '09:00', title: 'Palestra: Processos Seletivos CPO', loc: 'Auditório Sylvio de Magalhães Figueiredo', uniform: 'OP3/6.6', obs: 'Todos Oficiais de Val de Cães' },
                    { id: '06.06', time: '11:00', title: 'Honras de despedidas ao CPO-01', loc: 'CIABA', uniform: 'OP3/6.6', obs: '' },
                    { id: '06.07', time: '11:30', title: 'Deslocamento para Com4ºDN', loc: 'Lancha Maguary', uniform: 'OP3/6.6', obs: '' },
                    { id: '06.08', time: '12:20', title: 'Almoço no Com4ºDN', loc: 'Salão Nobre', uniform: 'OP3/6.6', obs: 'Comitiva do Distrito' },
                    { id: '06.09', time: '14:00', title: 'Palestra: Processos Seletivos CPO', loc: 'Auditório Portal da Amazônia', uniform: 'OP3/6.6', obs: 'Oficiais Com4ºDN, HNBe e CPAOR' },
                    { id: '06.11', time: '19:30', title: 'Jantar', loc: 'Estação das Docas', uniform: 'Esporte Amazônico', obs: 'Participantes: DN-01, C Alte Elkfury e DN-02' }
                ]
            },
            {
                date: '2025-05-07',
                label: '07 Mai (Qui)',
                events: [
                    { id: '07.01', time: '05:50', title: 'Café da Manhã', loc: 'Residência Funcional do Com4ºDN', uniform: 'OP3', obs: '' },
                    { id: '07.02', time: '06:10', title: 'Deslocamento Aeroporto', loc: 'Aeroporto Internacional de Belém', uniform: 'OP3', obs: '' },
                    { id: '07.03', time: '07:30', title: 'Regresso (Voo Azul 2640)', flight: 'AZU 2640', loc: 'Aeroporto Internacional de Belém', uniform: 'OP3', obs: '' }
                ]
            }
        ];

        const logistics = {
            vtrs: [
                { id: 1, auth: "V Alte BATISTA", model: "Toyota Corolla", plate: "RWY-6C87", driver: "SO-MG COELHO", phone: "21997777668" },
                { id: 2, auth: "C Alte (Ref-FN) ELKFURY", model: "Toyota Corolla", plate: "RWY-6D17", driver: "2° SG-MA GOULART", phone: "21973390076" },
                { id: 3, auth: "C Alte JOSÉ FÁBIO", model: "Toyota Corolla", plate: "SZF-4C02", driver: "1° SG-CP RAFAEL", phone: "91982393991" }
            ],
            uniforms: [
                { title: "OP3", desc: "Operacional do 4º Distrito (Camisa Polo e Calça Operacional)" },
                { title: "6.6 (Camuflado)", desc: "Uniforme de Campanha da Marinha (Farda completa)" },
                { title: "Esporte Amazônico", desc: "Calça social, camisa social de manga curta ou Guayabera, sapatos casuais." }
            ],
            stay: {
                loc: "Residência Funcional do Com4°DN",
                suite: "Suíte Master",
                period: "05 a 07 de Maio",
                attendant: "3°SG-AR Laerte"
            },
            authorities: [
                { rank: "V Alte", name: "BATISTA", role: "Comandante do 4º Distrito Naval" },
                { rank: "C Alte (Ref-FN)", name: "ELKFURY", role: "Secretário da CPO" },
                { rank: "C Alte", name: "JOSÉ FÁBIO", role: "Chefe do Estado-Maior do Com4ºDN" }
            ]
        };

        // HELPER FUNCTIONS
        const getMapsLink = (loc) => `https://www.google.com/maps/search/?api=1&query=Belém+${encodeURIComponent(loc)}`;
        const getFlightLink = (flight) => {
            const code = flight.replace(/\s/g, '').replace('GOL', 'GLO').replace('AZU', 'AZU');
            return `https://pt.flightaware.com/live/flight/${code}`;
        };
        const getCheckinLink = (flight) => {
            if(flight.includes('GOL')) return "https://www.voegol.com.br/check-in";
            if(flight.includes('AZU')) return "https://www.voeazul.com.br/check-in";
            return "#";
        };

        // RENDER LOGIC
        function init() {
            lucide.createIcons();
            renderTabs();
            renderSchedule(schedule[0].date);
            updateIndicator();
            setInterval(updateIndicator, 60000);
        }

        function renderTabs() {
            const container = document.getElementById('day-tabs');
            container.innerHTML = schedule.map(day => `
                <button onclick="renderSchedule('${day.date}')" id="tab-${day.date}" 
                    class="flex-shrink-0 px-6 py-2 rounded-full text-sm font-semibold transition-all
                    ${appState.currentDay === day.date ? 'navy-bg text-white shadow-md' : 'bg-white text-gray-500 border border-gray-200'}">
                    ${day.label}
                </button>
            `).join('');
        }

        function renderSchedule(date) {
            appState.currentDay = date;
            renderTabs();
            
            const dayData = schedule.find(d => d.date === date);
            const container = document.getElementById('schedule-container');
            
            container.innerHTML = `<div id="live-line" class="now-indicator hidden pulse-red"></div>` + 
                dayData.events.map(ev => `
                <div class="bg-white rounded-2xl p-4 shadow-sm border-l-4 gold-border relative transition-transform active:scale-[0.98]" id="ev-${ev.id}">
                    <div class="flex justify-between items-start mb-2">
                        <span class="text-xl font-bold navy-dark-bg text-white px-3 py-1 rounded-lg">${ev.time}</span>
                        <button onclick="showUniformDetails('${ev.uniform}')" class="text-[10px] font-bold navy-bg text-white px-2 py-1 rounded-full uppercase tracking-tight">
                            ${ev.uniform}
                        </button>
                    </div>
                    <h3 class="font-bold text-gray-800 leading-tight mb-1">${ev.title}</h3>
                    <div class="flex items-center text-gray-500 text-sm mb-2">
                        <i data-lucide="map-pin" class="w-3 h-3 mr-1"></i>
                        <a href="${getMapsLink(ev.loc)}" target="_blank" class="underline decoration-gold-text decoration-2 underline-offset-2">${ev.loc}</a>
                    </div>
                    
                    ${ev.flight ? `
                        <div class="mt-3 flex gap-2">
                            <a href="${getFlightLink(ev.flight)}" target="_blank" class="flex-1 flex items-center justify-center bg-blue-50 text-blue-700 py-2 rounded-xl text-xs font-bold border border-blue-100">
                                <i data-lucide="plane" class="w-3 h-3 mr-1"></i> FlightAware
                            </a>
                            ${appState.isTravel ? `
                                <a href="${getCheckinLink(ev.flight)}" target="_blank" class="flex-1 flex items-center justify-center bg-green-50 text-green-700 py-2 rounded-xl text-xs font-bold border border-green-100">
                                    <i data-lucide="check-square" class="w-3 h-3 mr-1"></i> Fazer Check-in
                                </a>
                            ` : ''}
                        </div>
                    ` : ''}
                    
                    ${ev.obs ? `<p class="mt-2 text-[10px] text-gray-400 italic font-medium">${ev.obs}</p>` : ''}
                </div>
            `).join('');
            
            lucide.createIcons();
            updateIndicator();
        }

        function updateIndicator() {
            const now = new Date();
            // Para testes, vamos ajustar a data "real" se não estivermos no dia do evento
            // Mas seguiremos a lógica real aqui:
            const h = now.getHours();
            const m = now.getMinutes();
            const timeStr = `${h.toString().padStart(2, '0')}:${m.toString().padStart(2, '0')}`;
            
            // Format today as YYYY-MM-DD
            const todayStr = now.toISOString().split('T')[0];
            const line = document.getElementById('live-line');
            
            if (appState.currentDay !== todayStr) {
                line.classList.add('hidden');
                return;
            }

            const dayData = schedule.find(d => d.date === appState.currentDay);
            const events = dayData.events;
            
            // Lógica para posicionar a linha
            // Vamos encontrar entre quais eventos estamos
            let targetTop = 0;
            let found = false;

            for (let i = 0; i < events.length; i++) {
                const el = document.getElementById(`ev-${events[i].id}`);
                if (timeStr >= events[i].time) {
                    targetTop = el.offsetTop + (el.offsetHeight / 2); // Centraliza no card
                    found = true;
                }
            }

            if (found) {
                line.classList.remove('hidden');
                line.style.top = `${targetTop}px`;
            } else {
                line.classList.add('hidden');
            }
        }

        // MODAL SYSTEM
        function openModal(type) {
            const content = document.getElementById('modal-content');
            const sheet = document.getElementById('bottom-sheet');
            const overlay = document.getElementById('modal-overlay');

            if (type === 'authorities') {
                content.innerHTML = `<h2 class="text-xl font-bold mb-4 navy-bg text-white p-3 rounded-xl">Autoridades</h2>
                    <div class="space-y-4">
                        ${logistics.authorities.map(a => `
                            <div class="flex items-center p-3 bg-gray-50 rounded-xl border border-gray-100">
                                <div class="w-12 h-12 rounded-full bg-blue-100 flex items-center justify-center text-blue-800 font-bold mr-3">${a.rank.charAt(0)}</div>
                                <div>
                                    <p class="font-bold text-gray-800">${a.rank} ${a.name}</p>
                                    <p class="text-xs text-gray-500">${a.role}</p>
                                </div>
                            </div>
                        `).join('')}
                    </div>`;
            } else if (type === 'logistics') {
                content.innerHTML = `<h2 class="text-xl font-bold mb-4 navy-bg text-white p-3 rounded-xl">Controle de Viaturas</h2>
                    <div class="space-y-4">
                        ${logistics.vtrs.map(v => `
                            <div class="p-4 bg-gray-50 rounded-2xl border border-gray-200">
                                <div class="flex justify-between items-start mb-2">
                                    <div>
                                        <p class="text-[10px] uppercase font-bold text-gray-400">Autoridade</p>
                                        <p class="font-bold text-navy">${v.auth}</p>
                                    </div>
                                    <span class="bg-gold-text text-black text-[10px] px-2 py-1 rounded font-bold">${v.plate}</span>
                                </div>
                                <div class="grid grid-cols-2 gap-2 text-sm mb-3">
                                    <div>
                                        <p class="text-[10px] text-gray-400">Modelo</p>
                                        <p class="font-medium">${v.model}</p>
                                    </div>
                                    <div>
                                        <p class="text-[10px] text-gray-400">Motorista</p>
                                        <p class="font-medium">${v.driver}</p>
                                    </div>
                                </div>
                                <div class="flex gap-2">
                                    <a href="tel:${v.phone}" class="flex-1 bg-navy-dark-bg text-white py-2 rounded-xl flex items-center justify-center gap-2">
                                        <i data-lucide="phone" class="w-4 h-4"></i> Ligar
                                    </a>
                                    <a href="https://wa.me/55${v.phone}" target="_blank" class="flex-1 bg-green-600 text-white py-2 rounded-xl flex items-center justify-center gap-2">
                                        <i data-lucide="message-square" class="w-4 h-4"></i> WhatsApp
                                    </a>
                                </div>
                            </div>
                        `).join('')}
                    </div>`;
            } else if (type === 'uniforms') {
                content.innerHTML = `<h2 class="text-xl font-bold mb-4 navy-bg text-white p-3 rounded-xl">Uniformes</h2>
                    <div class="space-y-3">
                        ${logistics.uniforms.map(u => `
                            <div class="p-3 bg-gray-50 rounded-xl border border-gray-200">
                                <p class="font-bold navy-dark-bg text-white inline-block px-2 py-0.5 rounded text-xs mb-1">${u.title}</p>
                                <p class="text-sm text-gray-600">${u.desc}</p>
                            </div>
                        `).join('')}
                    </div>`;
            } else if (type === 'stay') {
                content.innerHTML = `<h2 class="text-xl font-bold mb-4 navy-bg text-white p-3 rounded-xl">Hospedagem</h2>
                    <div class="bg-gray-50 p-6 rounded-2xl border border-gray-200">
                        <div class="text-center mb-4">
                            <i data-lucide="building" class="w-12 h-12 mx-auto text-gold-text mb-2"></i>
                            <p class="font-bold text-lg">${logistics.stay.loc}</p>
                            <p class="text-gray-500">${logistics.stay.suite}</p>
                        </div>
                        <hr class="my-4">
                        <div class="space-y-3">
                            <div class="flex justify-between">
                                <span class="text-gray-400 text-sm">Período</span>
                                <span class="font-bold">${logistics.stay.period}</span>
                            </div>
                            <div class="flex justify-between">
                                <span class="text-gray-400 text-sm">Despenseiro</span>
                                <span class="font-bold">${logistics.stay.attendant}</span>
                            </div>
                        </div>
                    </div>`;
            }
            
            overlay.classList.remove('hidden');
            sheet.classList.remove('modal-enter');
            sheet.classList.add('modal-active');
            lucide.createIcons();
        }

        function closeModal() {
            const sheet = document.getElementById('bottom-sheet');
            const overlay = document.getElementById('modal-overlay');
            
            sheet.classList.remove('modal-active');
            sheet.classList.add('modal-enter');
            setTimeout(() => overlay.classList.add('hidden'), 300);
        }

        function showUniformDetails(uniform) {
            openModal('uniforms');
        }

        function toggleType() {
            appState.isTravel = !appState.isTravel;
            renderSchedule(appState.currentDay);
            const msg = appState.isTravel ? "Modo VIAGEM ativado (Check-in liberado)" : "Modo VISITA INSTITUCIONAL ativado";
            alert(msg);
        }

        // Initialize
        window.onload = init;
    </script>
</body>
</html>
