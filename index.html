<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Programa de Eventos - Com4ºDN</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
        .navy-bg { background-color: #002D5E; }
        .navy-dark-bg { background-color: #001D3D; }
        .gold-bg { background-color: #FFBD26; }
        .gold-text { color: #FFBD26; }
        .gold-border { border-color: #FFBD26; }
        .glass { background: rgba(0, 45, 94, 0.98); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); }
        
        .modal-enter { transform: translateY(100%); transition: transform 0.3s ease-out; }
        .modal-active { transform: translateY(0); }
        
        .pulse-red {
            box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7);
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.4); }
            70% { box-shadow: 0 0 0 10px rgba(239, 68, 68, 0); }
            100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
        }

        .now-indicator {
            position: absolute;
            left: 0;
            right: 0;
            height: 2px;
            background-color: #ef4444;
            z-index: 20;
        }
        .now-indicator::before {
            content: '';
            position: absolute;
            left: -4px;
            top: -4px;
            width: 10px;
            height: 10px;
            background-color: #ef4444;
            border-radius: 50%;
        }
        .tab-active { background-color: #FFBD26; color: #001D3D; border-color: #FFBD26; }
        .header-sticky { position: sticky; top: 0; z-index: 50; }
    </style>
</head>
<body class="pb-24">

    <!-- Cabeçalho Fixo com Seletor de Dias -->
    <header class="header-sticky glass text-white border-b-2 gold-border shadow-lg">
        <div class="max-w-md mx-auto p-3">
            <div class="flex items-center mb-3">
                <img src="brasao.png" alt="Brasão Marinha" class="h-10 w-auto mr-3 object-contain" onerror="this.style.display='none'">
                <div class="flex flex-col justify-center">
                    <h1 class="text-[10px] uppercase tracking-widest font-bold opacity-90 leading-none mb-1">Marinha do Brasil</h1>
                    <h2 class="text-xs font-bold leading-tight uppercase">Comando do 4º Distrito Naval</h2>
                    <p class="text-[9px] gold-text font-semibold uppercase leading-none mt-1">Visita: C Alte (Refº-FN) Elkfury</p>
                </div>
            </div>
            <!-- Seletor de Dias Integrado ao Header -->
            <div class="grid grid-cols-3 gap-2" id="day-tabs">
                <!-- Tabs injetadas por JS -->
            </div>
        </div>
    </header>

    <!-- Conteúdo Principal -->
    <main class="max-w-md mx-auto p-4">
        <div class="relative space-y-4" id="schedule-container">
            <div id="live-line" class="now-indicator hidden pulse-red"></div>
            <!-- Cards injetados por JS -->
        </div>
    </main>

    <!-- Navegação de Acesso Rápido Inferior -->
    <nav class="fixed bottom-0 left-0 right-0 glass border-t gold-border px-1 py-3 z-40">
        <div class="max-w-md mx-auto flex justify-around items-center">
            <button onclick="openModal('authorities')" class="flex flex-col items-center text-white/70 hover:text-white">
                <i data-lucide="users" class="w-5 h-5"></i>
                <span class="text-[9px] mt-1">Autoridades</span>
            </button>
            <button onclick="openModal('logistics')" class="flex flex-col items-center text-white/70 hover:text-white">
                <i data-lucide="car" class="w-5 h-5"></i>
                <span class="text-[9px] mt-1">Viaturas</span>
            </button>
            <button onclick="openModal('uniforms')" class="flex flex-col items-center text-white/70 hover:text-white">
                <i data-lucide="shirt" class="w-5 h-5"></i>
                <span class="text-[9px] mt-1">Uniformes</span>
            </button>
            <button onclick="openModal('stay')" class="flex flex-col items-center text-white/70 hover:text-white">
                <i data-lucide="home" class="w-5 h-5"></i>
                <span class="text-[9px] mt-1">Estadia</span>
            </button>
            <button onclick="openModal('phones')" class="flex flex-col items-center text-white/70 hover:text-white">
                <i data-lucide="phone" class="w-5 h-5"></i>
                <span class="text-[9px] mt-1">Telefones</span>
            </button>
        </div>
    </nav>

    <!-- Modais -->
    <div id="modal-overlay" class="fixed inset-0 bg-black/60 hidden z-[60]" onclick="closeModal()"></div>
    <div id="bottom-sheet" class="fixed bottom-0 left-0 right-0 bg-white rounded-t-3xl z-[70] modal-enter max-w-md mx-auto shadow-2xl overflow-hidden">
        <div class="w-12 h-1.5 bg-gray-300 rounded-full mx-auto mt-3 mb-4"></div>
        <div id="modal-content" class="p-6 max-h-[80vh] overflow-y-auto"></div>
    </div>

        const schedule = [

                    { id: '05.02', time: '12:20', title: 'Deslocamento para a residência funcional do Com4°DN', loc: 'Residência Funcional do Com4°DN', uniform: 'OP3', obs: 'Participantes: DN-01, C Alte (Ref°-FN) Elkfury e DN-01.1' },
                    { id: '05.03', time: '12:45', title: 'Almoço na residência do Com4°DN', loc: 'Vila Naval Espadarte', uniform: 'ESPORTE AMAZÔNICO', obs: 'Participantes: DN-01 e C Alte (Ref°-FN) Elkfury' },
                    { id: '05.04', time: '19:30', title: 'Jantar', loc: 'Restaurante Amazônia na Cuia', uniform: 'ESPORTE AMAZÔNICO', obs: 'Participantes: DN-01, C Alte (Ref°-FN) Elkfury e DN-02' }

                    { id: '06.03', time: '08:20', title: 'Deslocamento para o CIABA', loc: 'CIABA', uniform: 'OP3', obs: '' },

                    { id: '06.06', time: '11:00', title: 'Honras de despedidas ao CPO-01', loc: 'CIABA', uniform: 'OP3', obs: '' },
                    { id: '06.07', time: '11:30', title: 'Deslocamento para o Com4ºDN', loc: 'Lancha Maguary (Embarque no CIABA)', uniform: 'OP3', obs: '' },
                    { id: '06.08', time: '12:20', title: 'Almoço no Com4ºDN', loc: 'Salão Nobre do Com4°DN', uniform: 'OP3', obs: 'Participantes: Comitiva do 4º Distrito Naval' },
                    { id: '06.09', time: '14:00', title: 'Palestra sobre os Processos Seletivos da CPO', loc: 'Com4ºDN - Auditório Portal da Amazônia', uniform: 'OP3', obs: 'Participantes: Oficiais do Com4°DN, HNBe e CPAOR' },
                    { id: '06.11', time: '19:30', title: 'Jantar', loc: 'Estação das Docas', uniform: 'ESPORTE AMAZÔNICO', obs: 'Participantes: DN-01, C Alte (Ref°-FN) Elkfury e DN-02' }
                ]
            },
            {
                date: '2025-05-07',
                label: '07 Mai (Qui)',
                events: [
                    { id: '07.01', time: '05:50', title: 'Café da Manhã', loc: 'Residência Funcional do Com4°DN', uniform: '', obs: 'Participantes: DN-01 e C Alte (Ref°-FN) Elkfury' },
                    { id: '07.02', time: '06:10', title: 'Deslocamento para o Aeroporto', loc: 'Aeroporto Internacional de Belém', uniform: 'OP3', obs: 'Participantes: DN-01, C Alte (Ref°-FN) Elkfury e DN-01.1' },
                    { id: '07.03', time: '07:30', title: 'Regresso (Voo Azul 2640)', flight: 'AZU 2640', loc: 'Aeroporto Internacional de Belém', uniform: 'OP3', obs: 'Participantes: DN-01, C Alte (Ref°-FN) Elkfury e DN-01.1' }
                ]
            }
        ];

        const logistics = {
            vtrs: [
                { auth: "V Alte BATISTA", model: "TOYOTA COROLLA", plate: "RWY-6C87", driver: "SO-MG COELHO", phone: "91982660201" },
                { auth: "C Alte (Ref-FN) ELKFURY", model: "TOYOTA COROLLA", plate: "RWY-6D17", driver: "2º SG-MA GOULART", phone: "21973390076" },
                { auth: "C Alte JOSÉ FÁBIO", model: "TOYOTA COROLLA", plate: "SZF-4C02", driver: "1º SG-CP RAFAEL", phone: "91982393991" }
            ],
            phones: [
                { superHeader: "COM4ºDN" },
                { name: "V Alte ADRIANO MARCELINO BATISTA", role: "Comandante", phone: "91982660201" },
                { name: "C Alte JOSÉ FABIO CARNEIRO DA SILVA", role: "CEM-Com4ºDN", phone: "91982660233" },
                { name: "CT ANTONIO DE OLIVEIRA CURA JUNIOR", role: "Assistente Com4°DN", phone: "91981250005" },
                { name: "CT (AA) CARLOS GABRIEL MUNIZ FRANCO", role: "Ajudante de Ordens", phone: "91982660283" },
                { name: "1T (AA) JOSÉ RENATO MENDES DE SOUZA", role: "Assistente do CEM", phone: "91982660275" },
                { header: "OFICIAIS DE SERVIÇO" },
                { name: "OSP - Com4ºDN", role: "Telefone Funcional", phone: "91982660154" },
                { name: "OSE - Com4ºDN", role: "Telefone Funcional", phone: "91982660328" },
                { superHeader: "TITULARES DE OM" },
                { name: "CMG (MD) JAIME LOBO FIGUEIREDO", role: "HNBe", phone: "91991854662" },
                { name: "CMG (IM) LEANDRO HERMES ZUQUIM", role: "CEIMBE", phone: "91982660202" },
                { name: "CMG LEONARDO AMORIM ROVERE", role: "CIABA", phone: "91982660312" },
                { name: "CMG DANIEL JUNIOR SILVA DA COSTA", role: "BNVC", phone: "91993491643" },
                { name: "CMG GUILHERME BARROS MOREIRA", role: "COMGPTPATNAVN", phone: "91981255555" },
                { name: "CMG ALEXANDRE B. PIMENTEL", role: "CPAOR", phone: "91982660009" },
                { name: "CF (FN) LUCIANO", role: "2°BtlOpRib", phone: "91982660123" }
            ]
        };

        let currentDayId = '';

        function init() {
            lucide.createIcons();
            const now = new Date();
            const todayStr = now.toISOString().split('T')[0];
            const hasDay = schedule.find(d => d.date === todayStr);
            currentDayId = hasDay ? todayStr : schedule[0].date;
            renderTabs();
            renderSchedule(currentDayId);
            updateIndicator();
            setInterval(updateIndicator, 60000);
        }

        function renderTabs() {
            const container = document.getElementById('day-tabs');
            container.innerHTML = schedule.map(day => `
                <button onclick="renderSchedule('${day.date}')" id="tab-${day.date}" 
                    class="py-2 rounded-lg text-[9px] font-bold transition-all border
                    ${currentDayId === day.date ? 'tab-active' : 'bg-white/10 text-white/60 border-white/20'}">
                    ${day.label}
                </button>
            `).join('');
        }

        function renderSchedule(date) {
            currentDayId = date;
            renderTabs();
            const dayData = schedule.find(d => d.date === date);
            const container = document.getElementById('schedule-container');
            container.innerHTML = `<div id="live-line" class="now-indicator hidden pulse-red"></div>` + 
                dayData.events.map(ev => {
                    const uInfo = ev.uniform ? (uniformMapping[ev.uniform.toUpperCase()] || { img: 'op3.png', label: ev.uniform }) : null;
                    return `
                    <div class="bg-white rounded-2xl p-4 shadow-sm border-l-4 gold-border relative" id="ev-${ev.id}">
                        <div class="flex justify-between items-start mb-2">
                            <span class="text-lg font-bold navy-dark-bg text-white px-3 py-1 rounded-lg">${ev.time}</span>
                            ${uInfo ? `
                                <div class="flex flex-col items-center" onclick="showUniformDetails('${ev.uniform}')">
                                    <img src="${uInfo.img}" class="h-9 w-auto mb-1 rounded border border-gray-100 object-cover" onerror="this.src='https://via.placeholder.com/40x50?text=U'">
                                    <span class="text-[8px] font-bold text-navy-bg uppercase">${ev.uniform}</span>
                                </div>
                            ` : ''}
                        </div>
                        <h3 class="font-bold text-gray-800 leading-tight mb-2 text-sm">${ev.title}</h3>
                        <div class="flex items-start text-gray-500 text-[11px] mb-2">
                            <i data-lucide="map-pin" class="w-3 h-3 mr-1 mt-0.5 flex-shrink-0 text-navy-bg"></i>
                            <a href="https://www.google.com/maps/search/?api=1&query=Belém+${encodeURIComponent(ev.loc)}" target="_blank" class="underline decoration-gold-text underline-offset-2 font-medium">${ev.loc}</a>
                        </div>
                        ${ev.flight ? `
                            <div class="mt-3 p-3 bg-blue-50 border border-blue-100 rounded-xl">
                                <div class="flex justify-between items-center">
                                    <span class="text-[10px] font-bold text-blue-800 uppercase tracking-tight">Voo: ${ev.flight}</span>
                                    <a href="https://pt.flightaware.com/live/flight/${ev.flight.replace(' ','')}" target="_blank" class="bg-blue-600 text-white px-3 py-1.5 rounded-lg text-[9px] font-bold flex items-center gap-1">
                                        <i data-lucide="plane" class="w-3 h-3"></i> Rastrear Voo
                                    </a>
                                </div>
                            </div>
                        ` : ''}
                        ${ev.obs ? `<div class="mt-3 pt-2 border-t border-gray-50"><p class="text-[10px] text-gray-500 italic"><b class="text-navy-bg not-italic">Obs:</b> ${ev.obs}</p></div>` : ''}
                    </div>`}).join('');
            lucide.createIcons();
            window.scrollTo({ top: 0, behavior: 'smooth' });
            updateIndicator();
        }

        function updateIndicator() {
            const now = new Date();
            const h = now.getHours();
            const m = now.getMinutes();
            const timeStr = `${h.toString().padStart(2, '0')}:${m.toString().padStart(2, '0')}`;
            const todayStr = now.toISOString().split('T')[0];
            const line = document.getElementById('live-line');
            if (currentDayId !== todayStr) { line.classList.add('hidden'); return; }
            const dayData = schedule.find(d => d.date === currentDayId);
            let targetTop = 0;
            let found = false;
            for (const ev of dayData.events) {
                const el = document.getElementById(`ev-${ev.id}`);
                if (el && timeStr >= ev.time) { targetTop = el.offsetTop + (el.offsetHeight / 2); found = true; }
            }
            if (found) { line.classList.remove('hidden'); line.style.top = `${targetTop}px`; }
            else { line.classList.add('hidden'); }
        }

        function openModal(type) {
            const content = document.getElementById('modal-content');
            const sheet = document.getElementById('bottom-sheet');
            const overlay = document.getElementById('modal-overlay');

            if (type === 'logistics') {

                                </div>

                                    <p class="text-[8px] text-gray-400 uppercase font-black mb-1">Motorista em Destaque</p>

                                        <span class="font-black text-navy-bg text-lg uppercase tracking-tight">${v.driver}</span>
                                        <div class="flex gap-2">
                                            <a href="tel:${v.phone}" class="flex items-center justify-center w-11 h-11 gold-bg text-navy-dark-bg rounded-full shadow-md border border-yellow-600 active:scale-90 transition-transform">
                                                <i data-lucide="phone" class="w-5 h-5"></i>
                                            </a>
                                            <a href="https://wa.me/55${v.phone}" target="_blank" class="flex items-center justify-center w-11 h-11 bg-green-600 text-white rounded-full shadow-md border border-green-800 active:scale-90 transition-transform">
                                                <i data-lucide="message-circle" class="w-5 h-5"></i>
                                            </a>
                                        </div>
                                    </div>
                                </div>
                            </div>`).join('')}
                    </div>`;
            } else if (type === 'phones') {
                content.innerHTML = `<h2 class="text-lg font-bold mb-4 navy-bg text-white p-3 rounded-xl text-center">Lista de Contatos</h2>
                    <div class="space-y-2">
                        ${logistics.phones.map(p => {
                            if (p.superHeader) return `<div class="mt-4 first:mt-0 navy-dark-bg text-white px-3 py-2 rounded-lg text-[10px] font-bold tracking-widest uppercase">${p.superHeader}</div>`;
                            if (p.header) return `<div class="mt-2 bg-gray-200 text-gray-700 px-3 py-1 rounded-md text-[9px] font-bold uppercase">${p.header}</div>`;
                            return `
                                <div class="p-3 bg-gray-50 rounded-xl flex justify-between items-center border border-gray-100 shadow-sm">
                                    <div class="max-w-[60%]">
                                        <p class="font-bold text-[11px] text-navy leading-tight mb-0.5 uppercase">${p.name}</p>
                                        <p class="text-[9px] text-gray-500 font-medium">${p.role}</p>
                                    </div>
                                    <div class="flex gap-2">
                                        <!-- Telefones e WhatsApp com ícones padronizados e alto contraste -->
                                        <a href="tel:${p.phone}" class="p-2.5 gold-bg text-navy-dark-bg rounded-lg shadow-sm border border-yellow-600 flex items-center justify-center">
                                            <i data-lucide="phone" class="w-4.5 h-4.5"></i>
                                        </a>
                                        <a href="https://wa.me/55${p.phone}" target="_blank" class="p-2.5 bg-green-600 text-white rounded-lg shadow-sm border border-green-700 flex items-center justify-center">
                                            <i data-lucide="message-circle" class="w-4.5 h-4.5"></i>
                                        </a>
                                    </div>
                                </div>`;
                        }).join('')}
                    </div>`;
            } else if (type === 'authorities') {
                content.innerHTML = `<h2 class="text-lg font-bold mb-4 navy-bg text-white p-3 rounded-xl text-center font-bold uppercase">Autoridades</h2>
                    <div class="space-y-3">
                        <div class="flex items-center p-3 bg-gray-50 rounded-xl border border-gray-100 shadow-sm">
                            <div class="w-10 h-10 rounded-full navy-bg flex items-center justify-center text-white font-bold mr-3">VB</div>
                            <div><p class="font-bold text-sm text-navy">V Alte BATISTA</p><p class="text-[10px] text-gray-500 uppercase font-semibold tracking-tighter">Comandante do 4º Distrito Naval</p></div>
                        </div>
                        <div class="flex items-center p-3 bg-gray-50 rounded-xl border border-gray-100 shadow-sm">
                            <div class="w-10 h-10 rounded-full navy-bg flex items-center justify-center text-white font-bold mr-3">RE</div>
                            <div><p class="font-bold text-sm text-navy">C Alte (Refº-FN) ELKFURY</p><p class="text-[10px] text-gray-500 uppercase font-semibold tracking-tighter">Secretário da CPO</p></div>
                        </div>
                    </div>`;
            } else if (type === 'uniforms') {
                const usedUniforms = new Set();
                schedule.forEach(day => day.events.forEach(ev => { if(ev.uniform) usedUniforms.add(ev.uniform.toUpperCase()) }));
                content.innerHTML = `<h2 class="text-lg font-bold mb-4 navy-bg text-white p-3 rounded-xl text-center font-bold uppercase">Uniformes do Programa</h2>
                    <div class="grid grid-cols-2 gap-3">
                        ${Array.from(usedUniforms).map(u => {
                            const info = uniformMapping[u] || { img: 'op3.png', label: u };
                            return `
                            <div class="p-3 border border-gray-100 rounded-xl text-center flex flex-col items-center bg-gray-50 shadow-sm">
                                <img src="${info.img}" class="h-24 w-auto mb-2 rounded shadow-sm" onerror="this.src='https://via.placeholder.com/80x100?text=${u}'">
                                <p class="text-[9px] font-bold text-navy uppercase leading-tight">${info.label}</p>
                            </div>`}).join('')}
                    </div>`;
            } else if (type === 'stay') {
                content.innerHTML = `<h2 class="text-lg font-bold mb-4 navy-bg text-white p-3 rounded-xl text-center font-bold uppercase">Estadia</h2>
                    <div class="bg-blue-50 p-6 rounded-2xl border border-blue-100 text-center shadow-inner">
                        <i data-lucide="home" class="w-10 h-10 mx-auto text-navy mb-2"></i>
                        <p class="font-bold text-navy text-lg">Residência Funcional do Com4ºDN</p>
                        <p class="text-[11px] text-gray-500 mb-4 font-semibold uppercase tracking-wider">Vila Naval Espadarte - Suíte Master</p>
                        <div class="bg-white p-4 rounded-xl text-left text-[11px] space-y-2 shadow-sm border border-blue-100">
                            <p><b class="text-navy">Período:</b> 05 a 07 de maio de 2025</p>
                            <p><b class="text-navy">Despenseiro:</b> 3ºSG-AR LAERTE</p>
                        </div>
                    </div>`;
            }
            overlay.classList.remove('hidden');
            sheet.classList.remove('modal-enter');
            sheet.classList.add('modal-active');
            lucide.createIcons();
        }

        function closeModal() {
            const sheet = document.getElementById('bottom-sheet');
            const overlay = document.getElementById('modal-overlay');
            sheet.classList.remove('modal-active');
            sheet.classList.add('modal-enter');
            setTimeout(() => overlay.classList.add('hidden'), 300);
        }

        function showUniformDetails(uniform) { openModal('uniforms'); }

        window.onload = init;
    </script>
</body>
